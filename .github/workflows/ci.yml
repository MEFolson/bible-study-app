# CI for the Flutter app in app/. Does not replace GitHub Pages (gh-pages).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: app

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Fetch release database and pack it
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p data/build
          curl -L --fail --retry 3 --retry-delay 2 \
            -o data/build/bible.sqlite.gz \
            https://github.com/MEFolson/bible-study-app/releases/download/v1.0.0/bible.sqlite.gz
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path("data/build/bible.sqlite.gz")
          got = hashlib.sha256(p.read_bytes()).hexdigest()
          want = "798f175d977fe871979a45cf97ad3db7ec2ebbb30d972726cac1184a12b615ba"
          if got != want:
              raise SystemExit(f"bible.sqlite.gz sha256 mismatch: {got}")
          print("bible.sqlite.gz sha256 ok")
          PY
          gzip -dc data/build/bible.sqlite.gz > data/build/bible.sqlite
          python3 app/tool/pack_db.py

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Build debug APK
        run: flutter build apk --debug
