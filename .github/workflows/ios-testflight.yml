# Manual build, sign and upload to TestFlight. Run it from the Actions tab once the
# repository secrets below exist. It never runs on push.
#
# Repository secrets (Settings, Secrets and variables, Actions):
#   APP_STORE_CONNECT_ISSUER_ID    Issuer ID shown on App Store Connect, Users and Access, Integrations
#   APP_STORE_CONNECT_KEY_ID       Key ID of a Team API key with the Admin role
#   APP_STORE_CONNECT_PRIVATE_KEY  Full text of the AuthKey_<KEY_ID>.p8 file
#   APPLE_TEAM_ID                  10 character Team ID (developer.apple.com, Account, Membership details)
#
# Signing is automatic: xcodebuild uses the API key to create or reuse the distribution
# certificate and the App Store provisioning profile for com.mfolson.biblestudy.
name: iOS build and upload to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "Version shown to testers"
        required: true
        default: "1.0.0"

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: com.mfolson.biblestudy
    steps:
      - name: Check secrets are set
        run: |
          missing=0
          for v in ASC_ISSUER_ID ASC_KEY_ID ASC_PRIVATE_KEY TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::secret for $v is not set"; missing=1; fi
          done
          exit $missing
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Fetch and pack the database
        run: .github/scripts/ios_prepare.sh
      - name: Write the API key to the runner (removed at the end)
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
      - name: Prepare the Xcode project
        working-directory: app
        run: flutter build ios --release --config-only --build-name "${{ inputs.build_name }}" --build-number "${{ github.run_number }}"
      - name: Archive (automatic signing)
        working-directory: app/ios
        run: |
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            archive
      - name: Export and upload to App Store Connect
        working-directory: app/ios
        run: |
          sed "s/__TEAM_ID__/$TEAM_ID/" ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ inputs.build_name }} (${{ github.run_number }}). It appears in App Store Connect, TestFlight, after Apple finishes processing."
      - name: Remove the API key
        if: always()
        run: rm -f "$KEY_PATH"
